name: Update ZIDANE Ratings

on:
  schedule:
    - cron: '19 8 * * *'  # 8:19 AM UTC daily (after overnight European results)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cython numpy
          pip install --no-build-isolation -r requirements.txt

      # Ratings cache lives in the Actions cache, NOT git (it's a regenerable
      # build artifact - zidane.py's incremental scratchpad - and re-committing a
      # gzip daily bloated the repo). Rolling key + prefix restore-keys: every run
      # writes a fresh entry and restores the most recent prior one. A miss (first
      # run / eviction) is safe: zidane.py rebuilds from scratch.
      - name: Restore ratings cache
        uses: actions/cache/restore@v4
        with:
          path: zidane_ratings.csv.gz
          key: zidane-ratings-${{ github.run_id }}
          restore-keys: zidane-ratings-

      - name: Run ratings engine
        run: python zidane.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      # Persist the freshly-updated cache for the next run (only reached if
      # zidane.py succeeded, so a failed run never saves a partial cache).
      - name: Save ratings cache
        uses: actions/cache/save@v4
        with:
          path: zidane_ratings.csv.gz
          key: zidane-ratings-${{ github.run_id }}

      - name: Generate web data
        run: python generate_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "ZIDANE Bot"
          git config user.email "zidane-bot@users.noreply.github.com"
          git add all_club_games.csv docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ratings $(date -u '+%Y-%m-%d')"
            # Race-safe push: if another commit landed during this run, rebase
            # the data update on top and retry. Avoids losing a day's data
            # update when a code push lands mid-cron-run.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed; retrying in 5s..."
              sleep 5
            done
          fi
